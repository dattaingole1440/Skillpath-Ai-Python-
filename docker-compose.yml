version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: skillpath_ai_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: skillpath_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: skillpath_ai_web
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:admin123@db:3306/skillpath_ai
      - SECRET_KEY=9a15ef07f7b2c9d74ab3597d398ea74f87a9df2e21b8f526b758b981255ee988
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - GEMINI_API_KEY=
    depends_on:
      - db

volumes:
  mysql_data:
