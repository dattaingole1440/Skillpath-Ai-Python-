<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SkillPath AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #F8F9FA;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        [data-bs-theme="dark"] {
            background-color: #0F172A;
        }
        .reset-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem;
        }
    </style>
</head>
<body>

    <div class="card reset-card bg-body">
        <div class="text-center mb-4">
            <div class="fs-1 text-success mb-2"><i class="bi-shield-check"></i></div>
            <h4 class="fw-bold m-0">Reset Password</h4>
            <p class="text-muted small mt-1">Please enter your new secure password below</p>
        </div>

        <form action="/auth/reset-password" method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi-lock text-muted"></i></span>
                    <input type="password" class="form-control bg-light border-start-0" id="password" name="password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="form-text small text-muted">Must be at least 6 characters.</div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2.5 rounded-pill fw-bold mt-2 shadow-sm">Save New Password</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
