<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillPath AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #F8F9FA;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        [data-bs-theme="dark"] {
            background-color: #0F172A;
        }
        .forgot-card {
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem;
        }
    </style>
</head>
<body>

    <div class="card forgot-card bg-body">
        <div class="text-center mb-4">
            <div class="fs-1 text-primary mb-2"><i class="bi-envelope-exclamation"></i></div>
            <h4 class="fw-bold m-0">Recover Password</h4>
            <p class="text-muted small mt-1">Enter your registered email and we'll print a reset link to the console logs.</p>
        </div>

        <div id="alertBox"></div>

        <form action="/auth/forgot-password" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control bg-light border-start-0" id="email" name="email" required placeholder="john@example.com">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold mt-2 shadow-sm">Send Reset Link</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small m-0">Remember password? <a href="/auth/login" class="text-decoration-none text-primary fw-semibold">Login here</a></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById("alertBox");

        if (urlParams.get("sent") === "true") {
            alertBox.innerHTML = `<div class="alert alert-info small" role="alert">
                A password recovery link has been printed to the <strong>server terminal console</strong>. Please copy and paste it into your browser address bar.
            </div>`;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
